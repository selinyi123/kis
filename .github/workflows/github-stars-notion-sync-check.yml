name: github-stars-notion-sync-check

on:
  push:
    paths:
      - "tools/github-stars-notion-sync/**"
      - ".github/workflows/github-stars-notion-sync-check.yml"
  pull_request:
    paths:
      - "tools/github-stars-notion-sync/**"
      - ".github/workflows/github-stars-notion-sync-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/github-stars-notion-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
